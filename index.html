<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Colombia · A Vacation Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root{ --ink:#1c2b33; --sea:#2a9d8f; --sun:#e9c46a; --coral:#e76f51; --paper:#fbf7ef; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:'Georgia','Times New Roman',serif; color:var(--ink); background:var(--paper); overflow:hidden; }
  #map{ position:absolute; inset:0; z-index:1; background:#a9d3d0; }

  .brand{ position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:900; text-align:center; pointer-events:none; }
  .brand h1{ margin:0; font-size:20px; letter-spacing:2px; text-transform:uppercase; color:var(--paper); text-shadow:0 1px 6px rgba(0,0,0,.55); }
  .brand small{ color:var(--paper); opacity:.9; letter-spacing:3px; font-size:10px; text-shadow:0 1px 4px rgba(0,0,0,.6);}

  .topbtn{ position:absolute; z-index:900; top:12px; right:12px; background:var(--paper); border:1px solid rgba(0,0,0,.1);
    border-radius:20px; padding:7px 14px; font-family:Arial,sans-serif; font-size:12px; letter-spacing:1px; color:var(--ink);
    text-decoration:none; box-shadow:0 4px 12px rgba(0,0,0,.2); }
  .topbtn:hover{ background:#fff; }

  /* photo card — shows the WHOLE image, uncropped */
  #card{ position:absolute; z-index:1000; bottom:20px; left:50%; transform:translateX(-50%);
    width:min(430px, 94vw); background:var(--paper); border-radius:14px;
    box-shadow:0 14px 40px rgba(0,0,0,.35); border:1px solid rgba(0,0,0,.08);
    transition:opacity .35s ease, transform .35s ease; }
  #card.hidden{ opacity:0; transform:translateX(-50%) translateY(20px); pointer-events:none; }
  .media{ position:relative; width:100%; }
  .frame{ width:100%; background:#12181b; display:flex; align-items:center; justify-content:center; border-radius:14px 14px 0 0; overflow:hidden; }
  #photo{ max-width:100%; max-height:68vh; width:auto; height:auto; display:block; }
  #video{ max-width:100%; max-height:68vh; width:auto; height:auto; display:none; background:#000; }
  .meta{ padding:11px 16px 13px; }
  .meta .place{ font-size:18px; font-weight:bold; margin:0 0 2px; }
  .meta .when{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--coral); font-family:Arial,sans-serif;}
  .badge{ display:inline-block; font-family:Arial,sans-serif; font-size:10px; letter-spacing:1px; text-transform:uppercase;
    background:var(--sea); color:#fff; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle;}
  .counter{ float:right; font-size:12px; color:#9aa7ac; font-family:Arial,sans-serif; letter-spacing:1px;}

  #close{ position:absolute; top:8px; right:8px; z-index:2; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(0,0,0,.6); color:#fff; font-size:20px; line-height:34px; padding:0; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #close:hover{ background:rgba(0,0,0,.85); }
  #reopen{ position:absolute; z-index:1000; bottom:24px; left:50%; transform:translateX(-50%); display:none;
    background:var(--coral); color:#fff; border:none; border-radius:24px; padding:11px 20px; font-family:Arial,sans-serif; font-size:14px; font-weight:bold; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  .navbtn{ position:absolute; top:50%; z-index:3; height:52px; min-width:52px; padding:0 18px; border:none; border-radius:26px; cursor:pointer;
    background:var(--coral); color:#fff; font-family:Arial,sans-serif; font-size:17px; font-weight:bold; letter-spacing:.5px; white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; gap:6px; transform:translateY(-50%); transition:background .2s, transform .1s; }
  .navbtn .arr{ font-size:26px; line-height:1; margin-top:-3px; }
  .navbtn:hover{ background:#d35c3f; transform:translateY(-50%) scale(1.06); }
  .navbtn:active{ transform:translateY(-50%) scale(.95); }
  #prev{ right:calc(100% + 14px); }
  #next{ left:calc(100% + 14px); }
  /* not enough room beside the card: sit on the picture's edges, arrow only */
  @media (max-width:700px){
    .navbtn{ padding:0; width:48px; min-width:48px; height:48px; border-radius:50%; background:rgba(231,111,81,.92); border:2px solid #fff; }
    .navbtn .lbl{ display:none; }
    #prev{ right:auto; left:8px; }
    #next{ left:auto; right:8px; }
  }

  #rail{ position:absolute; z-index:900; top:0; bottom:0; right:8px; display:flex; flex-direction:column; justify-content:center; gap:5px; }
  #rail .dot{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.65); border:1px solid rgba(0,0,0,.25); cursor:pointer; transition:transform .15s; }
  #rail .dot.on{ background:var(--coral); transform:scale(1.5); }

  .numpin{ background:var(--sea); color:#fff; border:2px solid #fff; border-radius:50% 50% 50% 0; width:26px; height:26px;
    transform:rotate(-45deg); box-shadow:0 3px 8px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; font-family:Arial; font-size:11px; font-weight:bold;}
  .numpin span{ transform:rotate(45deg); }
  .numpin.vid{ background:#8e44ad; }
  .numpin.active{ background:var(--coral); width:32px; height:32px; z-index:999; }

  #intro{ position:absolute; inset:0; z-index:2000; background:linear-gradient(160deg,#264653,#2a9d8f); color:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transition:opacity .6s; }
  #intro h1{ font-size:min(46px,11vw); letter-spacing:4px; margin:0 0 6px; text-transform:uppercase;}
  #intro p{ max-width:340px; font-size:16px; line-height:1.5; opacity:.92; }
  #intro .dates{ letter-spacing:3px; font-size:13px; margin-top:4px; opacity:.8; font-family:Arial;}
  #intro button{ margin-top:26px; padding:13px 34px; border:none; border-radius:30px; background:var(--sun); color:#264653;
    font-size:15px; font-weight:bold; letter-spacing:2px; cursor:pointer; font-family:Arial; box-shadow:0 8px 22px rgba(0,0,0,.3);}
  #intro button:hover{ background:#f2d689; }
  #intro.gone{ opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="map"></div>
<div class="brand"><h1>Colombia</h1><small id="brandsub"></small></div>
<div id="rail"></div>

<div id="card" class="hidden">
  <button id="close" aria-label="Close picture" title="Close and explore the map">×</button>
  <div class="media">
    <div class="frame">
      <img id="photo" alt="">
      <video id="video" controls playsinline preload="metadata"></video>
    </div>
    <button class="navbtn" id="prev" aria-label="Previous picture"><span class="arr">‹</span><span class="lbl">Back</span></button>
    <button class="navbtn" id="next" aria-label="Next picture"><span class="lbl">Next</span><span class="arr">›</span></button>
  </div>
  <div class="meta">
    <span class="counter" id="counter"></span>
    <p class="place" id="place"></p>
    <p class="when" id="when"></p>
  </div>
</div>


<button id="reopen">▶ Continue the slideshow</button>

<div id="intro">
  <h1>Colombia</h1>
  <p>Ten days on the Caribbean coast, in Cartagena's old walls, and up in the mountains of Antioquia — pinned where they happened.</p>
  <div class="dates" id="introdates"></div>
  <button id="start">Begin the trip ›</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="pool.js"></script>
<script>
// Build the itinerary from the shared POOL + any custom selection saved by the checker.
const byFile={}; POOL.forEach(p=>{ if(!byFile[p.file]) byFile[p.file]=p; });
let PHOTOS = POOL.slice();
// dedupe + chronological
PHOTOS = [...new Map(PHOTOS.map(p=>[p.file,p])).values()].sort((a,b)=>a.sort.localeCompare(b.sort));

// Colombia-only map: restricted bounds so you never see the whole world.
const COL_BOUNDS = L.latLngBounds([-4.3,-79.6],[13.6,-66.8]);
const map = L.map('map',{ zoomControl:true, attributionControl:true, maxBounds:COL_BOUNDS, maxBoundsViscosity:0.9, minZoom:6, maxZoom:17 });
// Esri World Imagery (satellite) + a transparent labels overlay — free, no API key, no usage-policy blocking.
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics', maxZoom:17
}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{
  maxZoom:17, opacity:0.9
}).addTo(map);
const tripBounds = L.latLngBounds(PHOTOS.map(p=>[p.lat,p.lon]));
map.fitBounds(tripBounds,{padding:[60,60]});

L.polyline(PHOTOS.map(p=>[p.lat,p.lon]),{color:'#e76f51',weight:2,opacity:.5,dashArray:'4 6'}).addTo(map);

let cur=0;
PHOTOS.forEach((p,i)=>{
  const isV=p.type==='video';
  const icon=L.divIcon({className:'', html:`<div class="numpin ${isV?'vid':''}" id="pin${i}"><span>${isV?'▶':i+1}</span></div>`, iconSize:[26,26], iconAnchor:[13,26]});
  const m=L.marker([p.lat,p.lon],{icon}).addTo(map); m.on('click',()=>go(i));
});

const rail=document.getElementById('rail');
PHOTOS.forEach((p,i)=>{ const d=document.createElement('div'); d.className='dot'; d.title=p.place; d.onclick=()=>go(i); rail.appendChild(d); });
const dots=[...rail.children];

const photo=document.getElementById('photo'), video=document.getElementById('video'), card=document.getElementById('card');
function go(i){
  cur=(i+PHOTOS.length)%PHOTOS.length; const p=PHOTOS[cur];
  document.querySelectorAll('.numpin').forEach(n=>n.classList.remove('active'));
  const pin=document.getElementById('pin'+cur); if(pin) pin.classList.add('active');
  dots.forEach((d,j)=>d.classList.toggle('on',j===cur));
  video.pause();
  if(p.type==='video'){
    photo.style.display='none'; video.style.display='block'; video.src=p.file; if(p.poster) video.poster=p.poster; video.load();
    fill(p);
  }else{
    video.style.display='none'; photo.style.display='block';
    const img=new Image(); img.onload=()=>{ photo.src=p.file; fill(p); }; img.src=p.file;
  }
  map.flyTo([p.lat,p.lon], (p.region==='Guatapé'||p.region==='Tayrona')?12:13, {duration:1.1});
}
function fill(p){
  document.getElementById('place').innerHTML=p.place + (p.type==='video'?'<span class="badge">▶ video</span>':'');
  document.getElementById('when').textContent=`${p.day} · ${p.date} · ${p.time}`;
  document.getElementById('counter').textContent=`${cur+1} / ${PHOTOS.length}`;
  card.classList.remove('hidden');
  document.getElementById('reopen').style.display='none';
}
function closeCard(){
  video.pause(); card.classList.add('hidden');
  document.getElementById('reopen').style.display='block';
}
document.getElementById('close').onclick=closeCard;
document.getElementById('reopen').onclick=()=>go(cur);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')go(cur+1); if(e.key==='ArrowLeft')go(cur-1); if(e.key==='Escape')closeCard(); });

const d0=PHOTOS[0].date, d1=PHOTOS[PHOTOS.length-1].date;
document.getElementById('introdates').textContent=d0+'  —  '+d1;
document.getElementById('brandsub').textContent=d0+' – '+d1;
document.getElementById('start').onclick=()=>{
  document.getElementById('intro').classList.add('gone');
  setTimeout(()=>{ document.getElementById('intro').style.display='none'; go(0); }, 500);
};
</script>
</body>
</html>
